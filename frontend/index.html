 <!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book store</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Navigation -->
     <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-book"></i>
                <span>Book World</span>
            </div>
            
            <div class="nav-menu">
                <a href="#home" class="nav-link active">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="#books" class="nav-link">
                    <i class="fas fa-book-open"></i>
                    <span>Books</span>
                </a>
                <a href="#categories" class="nav-link">
                    <i class="fas fa-list"></i>
                    <span>Categories</span>
                </a>
                <a href="#cart" class="nav-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Cart</span>
                    <span class="cart-count">0</span>
                </a>
                <a href="#profile" class="nav-link">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </a>
            </div>

            <div class="nav-search">
                <input type="text" id="search-input" placeholder="Kitob qidirish...">
                <button class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app">
        <!-- Dynamic content will be loaded here -->
    </main> 

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
              <h3>Kitoblar Olami</h3>
                <p>Eng sara kitoblar faqat bizda</p>
            </div>
            <div class="footer-section">
                <h4>Aloqa</h4>
                <p>+998 90 123 45 67</p>
                <p>info@kitoblarolami.uz</p>
            </div>
            <div class="footer-section">
                <h4>Ijtimoiy tarmoqlar</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-telegram"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-facebook"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/animations.js"></script>
    <script src="js/components/Navigation.js"></script>
    <script src="js/components/BookCard.js"></script>
    <script src="js/components/SearchFilter.js"></script>
    <script src="js/components/Cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
