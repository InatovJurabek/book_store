<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Books - BookVerse</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/components/header.css">
    <link rel="stylesheet" href="../styles/components/cards.css">
    <link rel="stylesheet" href="../styles/components/forms.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="../index.html">BookVerse</a>
                </div>
                
                <div class="nav-menu" id="nav-menu">
                    <ul class="nav-list">
                        <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
                        <li class="nav-item"><a href="../views/books.html" class="nav-link active">Books</a></li>
                        <li class="nav-item"><a href="../views/categories.html" class="nav-link">Categories</a></li>
                        <li class="nav-item">
                            <a href="cart.html" class="nav-link">
                                Cart
                                <span class="cart-count" style="display: none;">0</span>
                            </a>
                        </li>
                        <li class="nav-item"><a href="profile.html" class="nav-link">Profile</a></li>
                    </ul>
                </div>
                
                <div class="nav-actions">
                    <button class="btn-signin">Sign In</button>
                    <div class="hamburger" id="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Books Header -->
    <section class="page-header">
        <div class="container">
            <h1>All Books</h1>
            <p>Discover our complete collection</p>
        </div>
    </section>

    <!-- Search and Filters -->
    <section class="filters-section">
        <div class="container">
            <div class="search-filters">
                <div class="search-form">
                    <input type="text" class="search-input" placeholder="Search books or authors...">
                    <span class="search-icon">🔍</span>
                </div>
                
                <div class="filter-group">
                    <select class="filter-select" data-filter="category">
                        <option value="">All Categories</option>
                        <option value="fiction">Fiction</option>
                        <option value="sci-fi">Science Fiction</option>
                        <option value="mystery">Mystery</option>
                        <option value="self-help">Self Help</option>
                        <option value="memoir">Memoir</option>
                    </select>
                    
                    <select class="filter-select" data-filter="price">
                        <option value="">Any Price</option>
                        <option value="under-20">Under $20</option>
                        <option value="20-30">$20 - $30</option>
                        <option value="over-30">Over $30</option>
                    </select>
                    
                    <select class="filter-select" data-filter="sort">
                        <option value="popular">Most Popular</option>
                        <option value="newest">Newest First</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Books Grid -->
    <section class="books-section">
        <div class="container">
            <div class="books-grid" id="books-grid">
                <!-- Books will be populated by JavaScript -->
            </div>
            
            <!-- Load More -->
            <div class="load-more text-center">
                <button class="btn-primary" id="load-more">Load More Books</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 BookVerse. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/utils/api.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/animation.js"></script>
    <script src="js/components/Navigation.js"></script>
    <script src="js/components/SearchFilter.js"></script>
    <script src="js/components/Cart.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new SearchFilter();
            new Cart();
        });
    </script>
</body>
</html>
