<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtma - Kitoblar Olami</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <link rel="stylesheet" href="../styles/components/forms.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->

    <div class="breadcrumb">
        <div class="breadcrumb-content">
            <a href="index.html">Bosh Sahifa</a> / 
            <a href="cart.html">Savat</a> / 
            <span>Buyurtma</span>
        </div>
    </div>

    <main>
        <div class="container">
            <div class="checkout-layout">
                <div class="checkout-form">
                    <h2>Buyurtma Ma'lumotlari</h2>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label class="form-label">Ism</label>
                            <input type="text" class="form-input" name="name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telefon</label>
                            <input type="tel" class="form-input" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Manzil</label>
                            <textarea class="form-textarea" name="address" required></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Qo'shimcha izoh</label>
                            <textarea class="form-textarea" name="notes"></textarea>
                        </div>
                        <button type="submit" class="cta-button">
                            <i class="fas fa-check"></i> Buyurtma Berish
                        </button>
                    </form>
                </div>
                
                <div class="order-summary">
                    <h3>Buyurtma Xulosasi</h3>
                    <div id="order-items">
                        <!-- Order items JavaScript tomonidan to'ldiriladi -->
                    </div>
                    <div class="order-total">
                        <strong>Jami: <span id="order-total-amount">0 so'm</span></strong>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
